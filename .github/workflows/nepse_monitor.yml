name: NEPSE Daily EMA Crossover Monitor

on:
  schedule:
    # 11:00 AM Nepal time (UTC+5:45) = 05:15 UTC, Monday-Friday
    - cron: "15 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nepse-daily-ema-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NEPSE cloud monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_scanner.py
